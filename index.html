<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🧠 BrainSpark Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
    font-family: Arial, sans-serif;
    background:#eef5ff;
    text-align:center;
    margin:0;
}
.container{ margin-top:60px; }

h1{
    font-family:'Pacifico', cursive;
    font-size:48px;
}
.brain{ color:#ff5722; }
.spark{ color:#3f51b5; }

.subtitle{ color:#555; font-size:18px; }

button, select{
    padding:10px 18px;
    font-size:16px;
    margin:8px;
    cursor:pointer;
}

.hidden{ display:none; }

#options button{
    display:block;
    width:300px;
    margin:10px auto;
}

.correct{ background:#4CAF50; color:white; }
.wrong{ background:#f44336; color:white; }

#timer{ color:#e91e63; font-size:18px; }

/* Performance colors */
.outstanding{ color:#4CAF50; }
.excellent{ color:#2196F3; }
.verygood{ color:#673AB7; }
.average{ color:#FF9800; }
.belowavg{ color:#F44336; }
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="container">
    <h1>🧠 <span class="brain">Brain</span><span class="spark">Spark</span></h1>
    <p class="subtitle">Test your programming knowledge</p>
    <button onclick="goToSelect()">Start</button>
</div>

<!-- SELECT -->
<div id="select" class="container hidden">
    <h2>Select Language</h2>
    <select id="langSelect">
        <option>Python</option>
        <option>Java</option>
        <option>C</option>
        <option>C++</option>
        <option>JavaScript</option>
    </select>

    <h2>Select Level</h2>
    <select id="levelSelect">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
    </select>
    <br>
    <button onclick="startQuiz()">Start Quiz</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="container hidden">
    <div id="timer">Time Left: <span id="time">15</span>s</div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <button onclick="nextQuestion()">Next</button>
</div>

<!-- RESULT -->
<div id="result" class="container hidden">
    <h2 id="scoreText"></h2>
    <h1 id="performanceText"></h1>
    <button onclick="restartSame()">Restart</button>
    <button onclick="goToSelectFromResult()">Continue</button>
</div>

<script>
/* QUESTIONS */
const questions = {
beginner:[
{q:"What is a programming language?",options:["OS","Compiler","Language","Hardware"],answer:2},
{q:"Used to print output?",options:["echo","print","show","write"],answer:1},
{q:"Loop keyword?",options:["for","repeat","go","run"],answer:0},
{q:"Variable stores?",options:["Value","Loop","Function","Class"],answer:0},
{q:"Code editor?",options:["Browser","VS Code","CPU","RAM"],answer:1}
],
intermediate:[
{q:"Which supports OOP?",options:["HTML","Python","CSS","SQL"],answer:1},
{q:"Function is used for?",options:["Storage","Reusability","Design","Output"],answer:1},
{q:"Array stores?",options:["Single","Multiple","None","Class"],answer:1},
{q:"Error in program?",options:["Bug","Virus","Crash","Hack"],answer:0},
{q:"Loop repeats?",options:["Once","Twice","Multiple","None"],answer:2}
],
advanced:[
{q:"OOP concept?",options:["Loop","Encapsulation","Print","Input"],answer:1},
{q:"Compiler does?",options:["Executes","Translates","Stores","Deletes"],answer:1},
{q:"Algorithm is?",options:["Code","Steps","Program","Output"],answer:1},
{q:"Data structure?",options:["Array","Variable","Loop","Condition"],answer:0},
{q:"Debugging means?",options:["Testing","Fixing errors","Running","Stopping"],answer:1}
]
};

/* LOGIC */
let quizData=[], index=0, score=0;
let timer, timeLeft=15, answered=false;

function goToSelect(){
home.classList.add("hidden");
select.classList.remove("hidden");
}

function startQuiz(){
quizData = questions[levelSelect.value];
index=0; score=0;
select.classList.add("hidden");
quiz.classList.remove("hidden");
loadQuestion();
}

function loadQuestion(){
answered=false;
clearInterval(timer);
timeLeft=15;
time.innerText=timeLeft;

timer=setInterval(()=>{
timeLeft--;
time.innerText=timeLeft;
if(timeLeft===0) nextQuestion();
},1000);

let q=quizData[index];
question.innerText=q.q;
options.innerHTML="";

q.options.forEach((opt,i)=>{
let btn=document.createElement("button");
btn.innerText=opt;
btn.onclick=()=>checkAnswer(btn,i);
options.appendChild(btn);
});
}

function checkAnswer(btn,ans){
if(answered) return;
answered=true;
clearInterval(timer);

let correct=quizData[index].answer;
[...options.children].forEach((b,i)=>{
if(i===correct) b.classList.add("correct");
if(i===ans && ans!==correct) b.classList.add("wrong");
});
if(ans===correct) score++;
}

function nextQuestion(){
clearInterval(timer);
index++;
if(index<quizData.length) loadQuestion();
else showResult();
}

function showResult(){
quiz.classList.add("hidden");
result.classList.remove("hidden");

let total=quizData.length;
let percent=(score/total)*100;

scoreText.innerText=`Correct Answers: ${score} / ${total}`;
performanceText.className="";

if(percent>=90){
performanceText.innerText="🏆 OUTSTANDING";
performanceText.classList.add("outstanding");
}
else if(percent>=75){
performanceText.innerText="⭐ EXCELLENT";
performanceText.classList.add("excellent");
}
else if(percent>=60){
performanceText.innerText="👍 VERY GOOD";
performanceText.classList.add("verygood");
}
else if(percent>=40){
performanceText.innerText="🙂 AVERAGE";
performanceText.classList.add("average");
}
else{
performanceText.innerText="⚠️ BELOW AVERAGE";
performanceText.classList.add("belowavg");
}
}

function restartSame(){
result.classList.add("hidden");
index=0; score=0;
quiz.classList.remove("hidden");
loadQuestion();
}

function goToSelectFromResult(){
result.classList.add("hidden");
select.classList.remove("hidden");
}
</script>

</body>
</html>
